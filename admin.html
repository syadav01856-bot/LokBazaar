<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LokBazaar - Merchant Portal</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --primary: #9333ea;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg); color: var(--text-main); padding: 20px; }
    
    .container { max-width: 600px; margin: 0 auto; }
    
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    h2 { font-size: 18px; margin-bottom: 16px; color: var(--primary); display: flex; align-items: center; gap: 8px; }

    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-main); }
    
    input, select, textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 14px;
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(147, 51, 234, 0.1);
    }

    .btn {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      border-radius: var(--radius);
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .status-msg {
      margin-top: 10px;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="container">

  <div class="card">
    <h2><i data-lucide="store"></i> 1. दुकान रजिस्टर करें (Store Registration)</h2>
    <form id="storeForm">
      <div class="form-group">
        <label>दुकान/शोरूम का नाम (Store Name)</label>
        <input type="text" id="storeName" placeholder="उदा. रॉयल फ़र्नीचर & फ़ैशन" required>
      </div>
      <div class="form-group">
        <label>पूरा पता (Address & Landmark)</label>
        <input type="text" id="storeAddress" placeholder="उदा. मेन मार्केट, जयपुर" required>
      </div>
      <div class="form-group">
        <label>डिलीवरी की सीमा (Service Radius in KM)</label>
        <input type="number" id="storeRadius" value="10" required>
      </div>
      <button type="submit" class="btn">
        <span>दुकान सेव करें</span>
        <i data-lucide="arrow-right" size="16"></i>
      </button>
    </form>
    <div id="storeMsg" class="status-msg"></div>
  </div>

  <div class="card">
    <h2><i data-lucide="package-plus"></i> 2. सामान / आइटम जोड़ें (Add Product)</h2>
    <form id="productForm">
      <div class="form-group">
        <label>दुकान चुनें (Select Store)</label>
        <select id="storeSelect" required>
          <option value="">पहले दुकान चुनें...</option>
        </select>
      </div>
      <div class="form-group">
        <label>सामान का नाम (Product Name)</label>
        <input type="text" id="prodName" placeholder="उदा. Silk Saree / King Size Bed / Leather Shoes" required>
      </div>
      <div class="form-group">
        <label>कैटेगरी (Category)</label>
        <select id="prodCategory" required>
          <option value="Women Fashion">👗 Women Wear (साड़ी, कुर्ती)</option>
          <option value="Men Fashion">👔 Men Wear (शर्ट, जीन्स)</option>
          <option value="Footwear">👟 Footwear (जूते, चप्पल)</option>
          <option value="Furniture">🛋️ Furniture (पलंग, सोफा)</option>
          <option value="Home Decor">✨ Fancy Lighting & Decor</option>
          <option value="Electronics">🎧 Electronics & Gadgets</option>
        </select>
      </div>
      <div class="form-group">
        <label>कीमत (Price in ₹)</label>
        <input type="number" id="prodPrice" placeholder="उदा. 1499" required>
      </div>
      <div class="form-group">
        <label>विवरण (Description / Details)</label>
        <textarea id="prodDesc" rows="2" placeholder="सामान की खासियत, साइज़ या मटीरियल लिखें..."></textarea>
      </div>
      <button type="submit" class="btn" style="background:#10b981;">
        <span>आइटम लिस्ट करें</span>
        <i data-lucide="plus-circle" size="16"></i>
      </button>
    </form>
    <div id="prodMsg" class="status-msg"></div>
  </div>

</div>

<script>
  lucide.createIcons();

  const SUPABASE_URL = 'https://oehwcamwefkngwbcxnlq.supabase.co';
  const SUPABASE_ANON_KEY = 'Sb_publishable_4nRNt9HwR8oVK_cGOOSD_g_BgpgyIBj';
  const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  async function loadStores() {
    const { data, error } = await supabase.from('stores').select('store_id, store_name');
    const select = document.getElementById('storeSelect');
    if (data && data.length > 0) {
      select.innerHTML = '<option value="">दुकान चुनें...</option>' + 
        data.map(s => `<option value="${s.store_id}">${s.store_name}</option>`).join('');
    }
  }

  document.getElementById('storeForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('storeMsg');
    msg.innerText = 'सेव हो रहा है...';

    const { data: merchants } = await supabase.from('merchants').select('merchant_id').limit(1);
    const merchantId = merchants && merchants.length > 0 ? merchants[0].merchant_id : null;

    if (!merchantId) {
      msg.style.color = 'red';
      msg.innerText = 'त्रुटि: पहले Database में merchant मौजूद होना चाहिए!';
      return;
    }

    const { error } = await supabase.from('stores').insert([{
      merchant_id: merchantId,
      store_name: document.getElementById('storeName').value,
      address: document.getElementById('storeAddress').value,
      service_radius_km: parseFloat(document.getElementById('storeRadius').value)
    }]);

    if (error) {
      msg.style.color = 'red';
      msg.innerText = 'गलती: ' + error.message;
    } else {
      msg.style.color = 'green';
      msg.innerText = '✅ दुकान सफलता से जुड़ गई!';
      document.getElementById('storeForm').reset();
      loadStores();
    }
  });

  document.getElementById('productForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('prodMsg');
    msg.innerText = 'आइटम जोड़ा जा रहा है...';

    const { error } = await supabase.from('products').insert([{
      store_id: document.getElementById('storeSelect').value,
      name: document.getElementById('prodName').value,
      category: document.getElementById('prodCategory').value,
      price: parseFloat(document.getElementById('prodPrice').value),
      description: document.getElementById('prodDesc').value
    }]);

    if (error) {
      msg.style.color = 'red';
      msg.innerText = 'गलती: ' + error.message;
    } else {
      msg.style.color = 'green';
      msg.innerText = '🎉 सामान सफलतापूर्वक ऐप में लाइव हो गया!';
      document.getElementById('productForm').reset();
    }
  });

  loadStores();
</script>

</body>
  </html>
