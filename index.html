<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LokBazaar</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 8px 0 0;
      color: #d1d5db;
    }

    .search {
      padding: 20px;
      background: white;
    }

    .search input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    .content {
      padding: 20px;
    }

    .welcome {
      background: white;
      padding: 20px;
      border-radius: 14px;
      margin-bottom: 15px;
    }

    .welcome h2 {
      margin-top: 0;
    }

    .button {
      display: inline-block;
      background: #16a34a;
      color: white;
      padding: 12px 18px;
      border-radius: 10px;
      text-decoration: none;
      border: none;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <header>
    <h1>LokBazaar</h1>
    <p>दुनिया आपके पास</p>
  </header>

  <div class="search">
    <input type="text" placeholder="अपने आसपास खोजें...">
  </div>

  <div class="content">
    <div class="welcome">
      <h2>आपके लोकल मार्केट में स्वागत है</h2>
      <p>अपने आसपास की दुकानें, सामान और सेवाएँ एक ही जगह खोजें।</p>
      <button class="button">शुरू करें</button>
    </div>
  </div>

</body>
</html>
